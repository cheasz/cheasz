<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#081C18"/>
      <stop offset="0.55" stop-color="#020A08"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="340" y1="150" x2="860" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9FFE5"/>
      <stop offset="0.5" stop-color="#00FF9C"/>
      <stop offset="1" stop-color="#75FFD0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF9C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#00FF9C" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame"><rect x="22" y="22" width="1156" height="376" rx="22"/></clipPath>
    <clipPath id="nameClip"><rect x="315" y="150" width="570" height="120" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="376" rx="22" fill="#010504" stroke="#00FF9C" stroke-opacity=".28"/>
  <rect x="22" y="22" width="1156" height="376" rx="22" fill="url(#grid)"/>

  <g clip-path="url(#frame)">
    <rect x="22" y="-90" width="1156" height="90" fill="url(#scan)" opacity=".22">
      <animate attributeName="y" values="-90;430" dur="4.4s" repeatCount="indefinite"/>
    </rect>

    <!-- diagonal data rain -->
    <g font-family="monospace" font-size="14" fill="#00FF9C" opacity=".30">
      <text x="48" y="-20">43 48 45 41 53 5A<animate attributeName="y" values="-20;460" dur="5.1s" repeatCount="indefinite"/></text>
      <text x="154" y="-110">01000011 01001000<animate attributeName="y" values="-110;480" dur="6.7s" repeatCount="indefinite"/></text>
      <text x="956" y="-70">0x43484541535A<animate attributeName="y" values="-70;470" dur="5.7s" repeatCount="indefinite"/></text>
      <text x="1080" y="-170">C7 EA 52 00<animate attributeName="y" values="-170;480" dur="7.3s" repeatCount="indefinite"/></text>
    </g>

    <!-- left fingerprint -->
    <g transform="translate(150 210)" fill="none" stroke="#00FF9C" stroke-linecap="round" opacity=".52">
      <path d="M-54 42C-65 4-48-52 0-58C48-52 65 4 54 42" stroke-dasharray="190" stroke-dashoffset="190"><animate attributeName="stroke-dashoffset" values="190;0;0" keyTimes="0;.55;1" dur="4s" repeatCount="indefinite"/></path>
      <path d="M-38 54C-53 12-35-38 0-42C35-38 53 12 38 54" stroke-dasharray="160" stroke-dashoffset="160"><animate attributeName="stroke-dashoffset" values="160;0;0" keyTimes="0;.6;1" dur="3.6s" repeatCount="indefinite"/></path>
      <path d="M-20 60C-34 20-22-21 0-25C22-21 34 20 20 60" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" values="120;0;0" keyTimes="0;.65;1" dur="3.2s" repeatCount="indefinite"/></path>
      <path d="M0-8V58" stroke-dasharray="70" stroke-dashoffset="70"><animate attributeName="stroke-dashoffset" values="70;0;0" keyTimes="0;.7;1" dur="2.8s" repeatCount="indefinite"/></path>
      <circle r="84" stroke-opacity=".16" stroke-dasharray="8 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle>
    </g>

    <!-- right orbital monogram -->
    <g transform="translate(1050 210)">
      <circle r="84" fill="none" stroke="#00FF9C" stroke-opacity=".16"/>
      <circle r="62" fill="none" stroke="#00FF9C" stroke-opacity=".28" stroke-dasharray="7 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/></circle>
      <path d="M20-35A42 42 0 1 0 20 35" fill="none" stroke="#00FF9C" stroke-width="7" stroke-linecap="square" filter="url(#glow)"/>
      <circle r="4" fill="#B9FFE5" filter="url(#glow)"><animateMotion dur="4.2s" repeatCount="indefinite" path="M84 0A84 84 0 1 1-84 0A84 84 0 1 1 84 0"/></circle>
    </g>

    <!-- central pulse -->
    <ellipse cx="600" cy="210" rx="310" ry="105" fill="#00FF9C" opacity=".025" filter="url(#bigGlow)">
      <animate attributeName="rx" values="260;340;260" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".018;.075;.018" dur="2.7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- CHEASZ identity -->
    <g clip-path="url(#nameClip)">
      <text x="600" y="238" text-anchor="middle" font-family="monospace" font-size="112" font-weight="900" letter-spacing="16" fill="url(#nameFill)" filter="url(#glow)">CHEASZ</text>

      <!-- chromatic glitch shadows -->
      <text x="596" y="238" text-anchor="middle" font-family="monospace" font-size="112" font-weight="900" letter-spacing="16" fill="#00A8FF" opacity="0">CHEASZ
        <animate attributeName="opacity" values="0;0;.7;0;0" keyTimes="0;.44;.46;.49;1" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="x" values="596;596;590;604;596" keyTimes="0;.44;.46;.49;1" dur="3.1s" repeatCount="indefinite"/>
      </text>
      <text x="604" y="238" text-anchor="middle" font-family="monospace" font-size="112" font-weight="900" letter-spacing="16" fill="#FF2C74" opacity="0">CHEASZ
        <animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;.44;.46;.49;1" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="x" values="604;604;612;592;604" keyTimes="0;.44;.46;.49;1" dur="3.1s" repeatCount="indefinite"/>
      </text>

      <!-- slicing masks -->
      <rect x="300" y="175" width="610" height="8" fill="#010504" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.43;.45;.48;1" dur="3.1s" repeatCount="indefinite"/><animate attributeName="x" values="300;300;330;280;300" dur="3.1s" repeatCount="indefinite"/></rect>
      <rect x="300" y="218" width="610" height="5" fill="#010504" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.46;.48;.51;1" dur="4.3s" repeatCount="indefinite"/></rect>
    </g>

    <!-- signature line / hexadecimal name -->
    <g font-family="monospace" fill="#8CFFD5" opacity=".72">
      <text x="600" y="294" text-anchor="middle" font-size="13" letter-spacing="7">43:48:45:41:53:5A</text>
      <rect x="438" y="310" width="324" height="2" fill="#00FF9C" opacity=".22"/>
      <rect x="438" y="310" width="44" height="2" fill="#B9FFE5" filter="url(#glow)"><animate attributeName="x" values="438;718;438" dur="2.3s" repeatCount="indefinite"/></rect>
    </g>

    <!-- corner telemetry -->
    <g fill="none" stroke="#00FF9C" opacity=".48" stroke-width="2">
      <path d="M60 342h52l14-22 18 38 19-64 20 48h65" stroke-dasharray="260" stroke-dashoffset="260"><animate attributeName="stroke-dashoffset" values="260;0" dur="2.8s" repeatCount="indefinite"/></path>
      <path d="M940 342h35l14-31 16 47 18-77 20 61h98" stroke-dasharray="250" stroke-dashoffset="250"><animate attributeName="stroke-dashoffset" values="250;0" dur="2.4s" repeatCount="indefinite"/></path>
    </g>

    <!-- glitch bars -->
    <g fill="#00FF9C">
      <rect x="260" y="108" width="180" height="2" opacity="0"><animate attributeName="opacity" values="0;.7;0;0" dur="2.2s" repeatCount="indefinite"/><animate attributeName="x" values="260;330;250" dur=".2s" repeatCount="indefinite"/></rect>
      <rect x="735" y="322" width="210" height="3" opacity="0"><animate attributeName="opacity" values="0;0;.65;0" dur="2.9s" repeatCount="indefinite"/><animate attributeName="width" values="40;210;80" dur=".35s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <rect x="22" y="22" width="1156" height="376" rx="22" fill="none" stroke="#00FF9C" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".10;.48;.10" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <path d="M45 55V42h13M1155 55V42h-13M45 365v13h13M1155 365v13h-13" stroke="#B9FFE5" stroke-width="2" opacity=".75"/>
</svg>
